[package]
name = "parallel-downloader"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
tokio = { version = "1.54.0", features = ["rt-multi-thread", "fs", "macros", "io-util", "sync"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream"] }
futures = "0.3.34"
futures-util = "0.3.34"
url = "2.5.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
clap = { version = "4.6.7", features = ["derive"] }
